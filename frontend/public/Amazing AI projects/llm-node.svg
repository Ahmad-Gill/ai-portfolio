<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c22"/>
      <stop offset="1" stop-color="#0e1015"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#c98936"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#e0a458" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="240" r="260" fill="url(#glow)"/>

  <!-- server rack -->
  <g transform="translate(120 130)">
    <rect width="220" height="240" rx="18" fill="#23262e" stroke="#7c8aa0" stroke-opacity="0.5" stroke-width="3"/>
    <g fill="#1a1c22" stroke="#7c8aa0" stroke-opacity="0.4" stroke-width="2">
      <rect x="20" y="22" width="180" height="54" rx="10"/>
      <rect x="20" y="93" width="180" height="54" rx="10"/>
      <rect x="20" y="164" width="180" height="54" rx="10"/>
    </g>
    <g fill="url(#gold)">
      <circle cx="46" cy="49" r="8"/>
      <circle cx="46" cy="120" r="8"/>
      <circle cx="46" cy="191" r="8" opacity="0.5"/>
    </g>
    <g stroke="#7c8aa0" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <path d="M78 49 H170"/>
      <path d="M78 120 H150"/>
      <path d="M78 191 H160"/>
    </g>
  </g>

  <!-- stream of tokens -->
  <g stroke="#c98936" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M350 250 C400 250 410 250 450 250"/>
  </g>

  <!-- chat bubble with answer being written -->
  <g transform="translate(470 150)">
    <path d="M0 24 Q0 0 24 0 H196 Q220 0 220 24 V156 Q220 180 196 180 H60 L24 212 L30 180 H24 Q0 180 0 156 Z" fill="#f2efe9" opacity="0.94"/>
    <g stroke="#7c8aa0" stroke-width="9" stroke-linecap="round" opacity="0.75">
      <path d="M30 42 H190"/>
      <path d="M30 76 H170"/>
    </g>
    <g stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
      <path d="M30 110 H130"/>
    </g>
    <rect x="144" y="98" width="6" height="26" rx="3" fill="#c98936"/>
    <g fill="#c98936" opacity="0.7">
      <circle cx="40" cy="146" r="6"/>
      <circle cx="62" cy="146" r="6"/>
      <circle cx="84" cy="146" r="6"/>
    </g>
  </g>
</svg>
