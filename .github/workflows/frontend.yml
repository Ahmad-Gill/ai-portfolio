name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node Installation
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      # The whole .env file is stored in the FRONTEND_ENV repository secret
      - name: Create .env from Secrets
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          if [ -z "$FRONTEND_ENV" ]; then
            echo "::error::The FRONTEND_ENV secret is missing or empty."
            exit 1
          fi
          printf '%s\n' "$FRONTEND_ENV" > .env

          # Without a live API URL the site calls itself and every request fails
          API_URL=$(grep -E '^REACT_APP_API_URL=' .env | tail -n 1 | cut -d= -f2-)
          case "$API_URL" in
            https://*) echo "API URL: $API_URL" ;;
            *)
              echo "::error::REACT_APP_API_URL in FRONTEND_ENV must be the live https URL (found '$API_URL')."
              exit 1
              ;;
          esac

      - name: Build React Application
        run: npm run build

      - name: Verify Build Output
        run: |
          echo "Current Directory:"
          pwd

          echo "Project Files:"
          ls -la

          echo "Build Files:"
          ls -la build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_FRONTEND_HOST}} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONTEND_HOST}} << 'EOF'
              echo "Connected Successfully"
              whoami
              pwd
          EOF

      - name: Create Deployment Directory
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONTEND_HOST}} << 'EOF'
              mkdir -p ~/frontend
              rm -rf ~/frontend/*
          EOF

      - name: Deploy React Build
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONTEND_HOST}}:~/frontend/

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONTEND_HOST}} << 'EOF'
              echo "Deployment Directory:"
              ls -lah ~/frontend

              echo ""
              echo "Index File:"
              ls -lah ~/frontend/index.html

              echo ""
              echo "Static Assets:"
              ls -lah ~/frontend/static || true
          EOF

      - name: Deployment Complete
        run: echo "✅ Frontend deployed successfully to ~/frontend"