<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c22"/>
      <stop offset="1" stop-color="#0e1015"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#c98936"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#e0a458" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="230" r="260" fill="url(#glow)"/>

  <!-- open book -->
  <g transform="translate(400 260)">
    <path d="M-230 -110 Q-120 -150 0 -110 L0 120 Q-120 80 -230 120 Z" fill="#f2efe9" opacity="0.94"/>
    <path d="M230 -110 Q120 -150 0 -110 L0 120 Q120 80 230 120 Z" fill="#e8e2d6" opacity="0.94"/>
    <path d="M0 -110 L0 120" stroke="#c98936" stroke-width="4"/>
    <!-- text lines left -->
    <g stroke="#7c8aa0" stroke-width="7" stroke-linecap="round" opacity="0.7">
      <path d="M-200 -80 Q-120 -105 -30 -80"/>
      <path d="M-200 -50 Q-120 -75 -30 -50"/>
      <path d="M-200 -20 Q-120 -45 -30 -20"/>
      <path d="M-200 10 Q-130 -12 -70 6"/>
    </g>
    <!-- text lines right, being written -->
    <g stroke="#c98936" stroke-width="7" stroke-linecap="round">
      <path d="M30 -80 Q120 -105 200 -80"/>
      <path d="M30 -50 Q100 -70 150 -60"/>
    </g>
    <rect x="160" y="-76" width="6" height="28" rx="3" fill="#c98936"/>
  </g>

  <!-- quill -->
  <g transform="translate(560 120) rotate(35)">
    <path d="M0 0 C 30 40 30 120 0 190 C -30 120 -30 40 0 0 Z" fill="url(#gold)"/>
    <path d="M0 20 L0 230" stroke="#14100a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#e0a458">
    <path d="M150 90 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M660 400 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity="0.8"/>
    <path d="M110 380 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.6"/>
  </g>
</svg>
